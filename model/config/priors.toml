# ============================================================ Addendum A (2026-09-26): attended AFAD arm S2
# Post-primary extension; rules in docs/prespec.md Addendum A. Draws taken after every
# existing draw so S0/S1a/S1b reproduce the frozen run bit for bit.

[r_v2]  # attended gated AFAD, driver-initiated entry past the stop indication, per facing vehicle
family = "triangular"
lo = 3.5e-3
mode = 6.8e-3
hi = 2.1e-2
evidence = "Two independent attended-device settings (rule 1). Texas TTI 0-6407-1 Table 22, gated treatments, converted with Table 21 mean queue as the facing denominator: red/yellow lens + gate 8/367 cycles x 2 = 0.0109; stop/slow WOS + gate 8/198 x 6 = 0.0067; WOS/GOS + gate 6/190 x 7 = 0.0045; alternative signs + gate 10/264 x 6 = 0.0063. Minnesota 1999 AutoFlagger 5/313 stops x 2 (queue unreported, q = 2) = 0.0080. Range of centrals [0.0045, 0.0109]; widened one step of each endpoint's order (JC-1: 1e-3 below, 1e-2 above) -> [3.5e-3, 2.1e-2]; span under one order -> triangular; mode = pooled central 37/5,462 = 6.8e-3. The upper bound meets the ungated Texas observation (24/360 x 3 = 0.022), so the prior admits a gate arm that is not respected. First-vehicle scoring may understate per-facing rates up to 2x (JC-8); gate arm and cones suppress mid-queue departures at gated treatments."

[p_detect_s2]  # AFAD operator hold: operator sees a pre-release violation and holds the opposing unit on red (contested)
family = "uniform"
lo = 0.3
hi = 0.9
evidence = "Same bounds as p_detect_s0. TTI 0-6407-1 p.127: in every documented AFAD violation the supervising flagger stopped the motorist before oncoming traffic; that evidence was collected under attended AFADs, so it belongs to this configuration at least as much as to manual control. Small sample, wide uniform below certainty (rule 3); PRCC-reported; in the variant sets at 0.9 (optimistic-device) and 0.3 (pessimistic-device)."

[offset_op_m]  # AFAD operator's standing offset from the edgeline, metres (contested)
family = "uniform"
lo = 1.5
hi = 6.0
evidence = "No measurement of where AFAD operators stand. MUTCD Part 6 requires the device to be attended and its operator positioned out of the travelled way; TTI 0-6407-1 placed the operating flagger at the work-area midpoint, visible from both ends; NZ and QLD boom units are operated from a safe zone. Lower bound: on the shoulder just clear of the edgeline where the shoulder is narrow. Upper bound: behind the work area's delineation on a wide verge. Uniform (rule 3); PRCC-reported; in the variant sets at 6.0 (optimistic-device) and 1.5 (pessimistic-device). The W4d point-target length (1 m) and reach decay apply."

