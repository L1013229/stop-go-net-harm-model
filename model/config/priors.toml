[t_deploy_s]  # TOTAL incremental on-foot time for PTS heads (both ends, install + remove)
family = "triangular"
lo = 240.0
mode = 480.0
hi = 960.0
evidence = "Two heads x (position, level, aim, cable/checks) x install+remove; no published time-and-motion data — operational estimate, rule 2."

[enc_rate_vkm]
family = "loguniform"
lo = 1.0e-7
hi = 1.0e-5
evidence = "Companion-model encroachment prior (Glennon/Cooper/Ray syntheses), same rural-shoulder mechanism for the placement task."

[reach_alpha]
family = "uniform"
